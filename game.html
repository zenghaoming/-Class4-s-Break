        let debugLogBuffer = [];
        function logTrace(module, action, details = {}) {
            let now = new Date();
            let timestamp = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
            let line = `[${timestamp}] [${module.toUpperCase()}] ${action} | State: ${gameState} | Turn: ${turn} | Data: ${JSON.stringify(details)}`;
            debugLogBuffer.push(line);
            console.log(line);
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            logTrace("FATAL_ERROR", msg, { lineNo, columnNo, stack: error ? error.stack : "" });
            return false;
        };

        // 🌟 严格核验卡牌守恒状态
        function auditCardCounts() {
            let counts = {};
            for(let c of deck) counts[c] = (counts[c]||0) + 1;
            for(let p=0; p<4; p++) {
                for(let c of players[p].hand) counts[c] = (counts[c]||0) + 1;
                for(let c of players[p].discards) counts[c] = (counts[c]||0) + 1;
                for(let b of players[p].bonds) {
                    for(let c of b.cards) counts[c] = (counts[c]||0) + 1;
                }
            }
            if(pendingCardInfo && pendingCardInfo.card) {
                counts[pendingCardInfo.card] = (counts[pendingCardInfo.card]||0) + 1;
            }
            let violations = {};
            for(let name in counts) {
                if(counts[name] > 4) violations[name] = counts[name];
            }
            if(Object.keys(violations).length > 0) {
                logTrace("AUDIT_VIOLATION", "Card count exceeded 4!", violations);
            }
            return counts;
        }

        async function exportDebugLog() {
            auditCardCounts();
            let content = "=== 四班抽象之奕 运行调试日志 (Debug Trace) ===\n";
            content += `导出时间: ${new Date().toLocaleString()}\n`;
            content += `当前牌局状态: State=${gameState}, Turn=${turn}, 剩余牌数=${deck.length}\n`;
            content += "---------------------------------------------------------\n";
            content += debugLogBuffer.join("\n");
            content += "\n=== 牌局各玩家手牌状态 ===\n";
            for(let i=0; i<4; i++) {
                content += `玩家 ${i}: 手牌[${players[i].hand.join(', ')}] | 明牌[${players[i].revealedCards.join(', ')}] | 副露[${players[i].bonds.map(b=>b.name).join(', ')}] | Buffs[${JSON.stringify(buffs[i])}]\n`;
            }

            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'game_debug.log',
                        types: [{ description: 'Log Files', accept: { 'text/plain': ['.log', '.txt'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    showFloatingText(HUMAN_PLAYER, "📁 日志已保存到同级目录", "#4caf50");
                    return;
                } catch (e) {
                    if (e.name !== 'AbortError') console.warn("Picker save fallback", e);
                    else return;
                }
            }

            let blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            let d = new Date();
            let dateStr = d.toISOString().replace(/[-:T]/g, '').slice(0, 14);
            a.href = url;
            a.download = `game_debug_${dateStr}.log`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showFloatingText(HUMAN_PLAYER, "📥 日志文件已生成导出", "#4caf50");
        }

        let buffs = Array(4).fill().map(()=>({extraDraw:0, skipTurnCount:0, cannotDraw:false, extraPlay:0, onlyChiPengTurns:0, fishHookTurns:0, immune:false, trap:false, loveLetter:null}));
        let globalBuffs = { noChiPengTurns: 0 };
        let lastActivatedBond = null; let unskippableNextCard = false; let targetSelectionCallback = null; 
        let turn = 0; let gameState = "MENU"; 
        let isCurrentTurnExtra = false;

        let pendingCardInfo = { card: null, fromPlayer: -1, isUnskippable: false, isTrap: false, isStop: false, isHook: false, isHatCombo: false }; 
        let selectedCardsForPeng = []; let currentCanChi = false; let currentCanPeng = false; let isFirstLog = true; 
        let extraTurnQueue = []; let returnTurnAfterExtra = null; 
        
        let pendingHatPlay = null;
        let interruptState = null;

        function isAI(p) { return p !== HUMAN_PLAYER; }
        function isPrime(num) { if(num<=1) return false; if(num<=3) return true; if(num%2===0||num%3===0) return false; for(let i=5; i*i<=num; i+=6) { if(num%i===0||num%(i+2)===0) return false; } return true; }
        
        function addBondLog(p, type, title, desc, action) {
            logTrace("bond", `${title} by P${p}`, { type, desc, action });
            let lc = document.getElementById("bond-log-content"); if(isFirstLog) { lc.innerHTML = ""; isFirstLog = false; } 
            let c = type==="relation"?"relation":type==="faction"?"faction":type==="onplay"?"onplay":"system";
            let t = type==="relation"?"✨ 关系":type==="faction"?"🔥 阵营":type==="onplay"?"🃏 打出":"⚙️ 系统";
            let entry = document.createElement("div"); entry.className = `log-entry ${c}`;
            entry.innerHTML = `<div class="log-header">${t} - 玩家 ${p} ${isAI(p)?'(电脑)':''}</div><div style="color:#fff; font-weight:bold; margin-bottom:2px;">【${title}】</div><div class="log-desc">${desc}</div><div class="log-action">${action}</div>`;
            lc.appendChild(entry); lc.scrollTop = lc.scrollHeight;
        }

        function applyNegativeEffect(t, name, fn) {
            if(buffs[t].immune) { 
                buffs[t].immune = false; playSound("shield"); 
                addBondLog(t, "system", "免疫生效", `抵挡了【${name}】`, "护盾破裂！"); 
                showFloatingText(t, "🛡️ 免疫!", "#00bcd4"); updateUI(); return false; 
            } else { 
                fn(); return true; 
            }
        }

        function checkAndBreakLoveLetterOnBond(bondedP) {
            for(let i=0; i<4; i++) {
                if(buffs[i].loveLetter) {
                    let sender = i;
                    let target = buffs[i].loveLetter.target;
                    if(bondedP === sender || bondedP === target) {
                        logTrace("love", "LoveLetter broken by bond", { sender, target, brokenBy: bondedP });
                        buffs[sender].loveLetter = null;
                        showFloatingText(sender, "💔 情书契约解除!", "#ff4081");
                        showFloatingText(target, "💔 情书解除!", "#ff4081");
                        addBondLog(bondedP, "system", "情书梦醒", "由于一方发动了羁绊", "【八封情书】攻势提前终止解除！");
                    }
                }
            }
        }

        function initGlossary() { let list = document.getElementById("glossary-list"); list.innerHTML = ""; for(let f in FACTION_INFO) { let info = FACTION_INFO[f]; list.innerHTML += `<div class="glossary-item"><div class="glossary-icon-wrap"><div class="f-tag" style="background-color: ${info.color}; clip-path: ${info.shape};">${info.text}</div></div><div class="glossary-text"><h4>${f} (${info.req}人)</h4><p>${info.desc}</p></div></div>`; } }
        function openGlossary() { document.getElementById("glossary-modal").style.display = "flex"; }
        
        function openDeckModal() { 
            let grid = document.getElementById("deck-grid"); grid.innerHTML = ""; 
            let counts = {}; 
            for(let c of deck) counts[c] = (counts[c]||0)+1; 
            for(let name in CARD_DB) { 
                let c = document.createElement("div"); 
                c.className = "deck-item"; 
                if(CARD_DB[name].isWildcard) c.style.border = "2px solid #ffd700"; 
                let r = counts[name]||0; 
                if(r===0) c.style.opacity="0.3"; 
                let tc = document.createElement("div"); 
                tc.className = "tag-container"; 
                if(CARD_DB[name].factions && !CARD_DB[name].isWildcard) { 
                    for(let f of CARD_DB[name].factions) { 
                        let fi = FACTION_INFO[f]; 
                        if(fi) { 
                            let tag = document.createElement("div"); 
                            tag.className = "f-tag"; 
                            tag.style.backgroundColor = fi.color; 
                            tag.style.clipPath = fi.shape; 
                            tag.innerText = fi.text; 
                            tc.appendChild(tag); 
                        } 
                    } 
                } 
                c.appendChild(tc); 
                c.innerHTML += `<div style="margin-top:20px; text-align:center;">${name}</div><div class="deck-count">x${r}</div>`; 
                grid.appendChild(c); 
            } 
            document.getElementById("deck-modal").style.display = "flex"; 
        }

        function resetGame() { 
            logTrace("game", "resetGame", {});
            deck = []; 
            players = Array(4).fill().map(()=>({hand:[], bonds:[], discards:[], revealedCards:[]})); 
            buffs = Array(4).fill().map(()=>({extraDraw:0, skipTurnCount:0, cannotDraw:false, extraPlay:0, onlyChiPengTurns:0, fishHookTurns:0, immune:false, trap:false, loveLetter:null})); 
            globalBuffs = { noChiPengTurns: 0 }; turn = 0; gameState = "NORMAL"; isCurrentTurnExtra = false;
            pendingCardInfo = { card: null, fromPlayer: -1, isUnskippable: false, isTrap: false, isStop: false, isHook: false, isHatCombo: false }; 
            selectedCardsForPeng = []; currentCanChi = false; currentCanPeng = false; isFirstLog = true; lastActivatedBond = null; unskippableNextCard = false; extraTurnQueue = []; returnTurnAfterExtra = null; 
            pendingHatPlay = null; interruptState = null; targetSelectionCallback = null;
            document.getElementById("bond-log-content").innerHTML = '<div style="color:#777; text-align:center; margin-top:20px;">暂无羁绊触发</div>'; 
            for(let i=0; i<4; i++) document.getElementById(`river-${i}`).innerHTML = "";
            initGame(); 
        }
        
        // 🌟 严格初始化（物理守恒：31种牌 × 4张 = 124张）
        function initGame() { 
            initGlossary(); 
            let names = Object.keys(CARD_DB); 
            deck = [];
            for(let n of names) {
                for(let i=0; i<4; i++) deck.push(n); 
            }
            deck.sort(() => Math.random() - 0.5); 
            
            for(let p=0; p<4; p++) {
                for(let i=0; i<9; i++) {
                    players[p].hand.push(deck.pop()); 
                }
            }
            logTrace("game", "initGameCompleted", { deckLeft: deck.length, totalDeckInit: names.length * 4 });
            auditCardCounts();
            turnStart(0, false); 
        }

        function checkWin(p) {
            if(players[p].hand.length === 0) { 
                logTrace("game", `Player ${p} WON`, { reason: "hand_empty" });
                playSound("win"); triggerFlash(); gameState = "GAME_OVER"; 
                setUIState("GAME_OVER", `<div class="win-text">🎉 游戏结束</div>玩家 ${p} 成功清空手牌，获得胜利！`); 
                updateUI(); return true; 
            }
            if(players[p].hand.length === 1 && players[p].hand[0] === "沈鑫浩") { 
                logTrace("game", `Player ${p} WON`, { reason: "bald_combo" });
                playSound("epic_win"); triggerFlash(); triggerScreenShake(); gameState = "GAME_OVER"; 
                setUIState("GAME_OVER", `<div class="win-text">🎉 游戏结束</div>玩家 ${p} 触发【秃头被动】，直接绝杀！`); 
                addBondLog(p, "onplay", "秃头", "被动特效", "绝境反击，直接胜利！"); 
                updateUI(); return true; 
            }
            return false;
        }

        function turnStart(p, isExtraTurn = false) {
            if (gameState === "MENU") return;
            isCurrentTurnExtra = isExtraTurn;
            logTrace("turn", "turnStart", { player: p, isExtraTurn, deckLeft: deck.length });

            if(deck.length === 0) { 
                logTrace("game", "DrawGame (Deck Empty)", {});
                gameState = "GAME_OVER"; setUIState("GAME_OVER", `<div class="win-text" style="color:#aaa;">🤝 流局</div>牌库已尽，无人胜出！`); 
                updateUI(); return; 
            }
            if(globalBuffs.noChiPengTurns > 0) globalBuffs.noChiPengTurns--; 
            if(buffs[p].fishHookTurns > 0) buffs[p].fishHookTurns--; 
            turn = p; 

            // 八封情书每回合开始送一张
            if(buffs[p].loveLetter && buffs[p].loveLetter.remainingTurns > 0) {
                let target = buffs[p].loveLetter.target;
                if(players[p].hand.length > 0) {
                    let letterCard = players[p].hand.splice(Math.floor(Math.random()*players[p].hand.length), 1)[0];
                    let rIdx = players[p].revealedCards.indexOf(letterCard);
                    if(rIdx !== -1) players[p].revealedCards.splice(rIdx, 1);
                    players[target].hand.push(letterCard);
                    buffs[p].loveLetter.remainingTurns--;
                    let rem = buffs[p].loveLetter.remainingTurns;
                    playSound("mama");
                    showFloatingText(p, `💌 递出情书【${letterCard}】`, "#ff4081");
                    showFloatingText(target, `💌 收到情书【${letterCard}】`, "#ff4081");
                    addBondLog(p, "onplay", "八封情书", `递送给 玩家 ${target}`, `转移了一张【${letterCard}】(剩余 ${rem} 封)`);
                    if(rem <= 0) {
                        buffs[p].loveLetter = null;
                        addBondLog(p, "onplay", "八封情书", "八封已满", "八回合情书攻势圆满结束！");
                    }
                    if(checkWin(p)) return;
                } else {
                    buffs[p].loveLetter = null;
                }
            }
            
            if(buffs[turn].skipTurnCount > 0) { 
                buffs[turn].skipTurnCount--; playSound("jail"); 
                addBondLog(turn, "system", "回合跳过", "受控制影响", `跳过本回合`); 
                showFloatingText(turn, "🚫 睡眠/停止中", "#f44336"); 
                advanceTurn(); return; 
            }
            
            gameState = "NORMAL"; selectedCardsForPeng = []; let drawCount = 1;
            if(buffs[turn].cannotDraw) { 
                drawCount = 0; buffs[turn].cannotDraw = false; 
                addBondLog(turn, "system", "禁止抽卡", "受羁绊影响", "本回合无法摸牌。"); 
                showFloatingText(turn, "🚫 禁摸牌", "#f44336"); 
            }
            drawCount += buffs[turn].extraDraw; buffs[turn].extraDraw = 0;
            
            if(drawCount > 0) playSound("draw");
            for(let i=0; i<drawCount; i++) if(deck.length > 0) players[turn].hand.push(deck.pop());
            
            if(checkWin(turn)) return; 
            if(buffs[turn].onlyChiPengTurns > 0) { 
                buffs[turn].onlyChiPengTurns--; 
                addBondLog(turn, "system", "被嘲讽", "受影响只能吃碰", "跳过出牌！"); 
                showFloatingText(turn, "🤐 被嘲讽", "#f44336"); 
                advanceTurn(); return; 
            }

            if(isExtraTurn) {
                unskippableNextCard = true;
                showFloatingText(turn, "⏰ 追加回合!", "#00e5ff");
                addBondLog(turn, "system", "⏰ 追加回合", "行动受限", "获得追加回合！(此回合不可吃碰，出牌一切效果失效)");
            }
            
            let tip = isExtraTurn 
                ? `<span style="color:#00e5ff;">【⏰ 追加回合】</span>轮到 玩家 ${turn} ${isAI(turn)?'(电脑) 思考中...':'出牌'}<br><span style="font-size:12px; color:#ff5252;">（不可吃碰，出牌一切技能效果失效）</span>`
                : `轮到 玩家 ${turn} ${isAI(turn)?'(电脑) 思考中...':'出牌'}`;

            setUIState("NORMAL", tip); 
            updateUI();
            
            if(isAI(turn)) setTimeout(aiPlayTurn, 650);
        }

        function advanceTurn() {
            logTrace("turn", "advanceTurn", { extraTurnQueueLen: extraTurnQueue.length, currentTurn: turn });
            if(extraTurnQueue.length > 0) {
                let nextP = extraTurnQueue.shift();
                turnStart(nextP, true);
            } else if(returnTurnAfterExtra !== null) {
                let back = returnTurnAfterExtra;
                returnTurnAfterExtra = null;
                turnStart(back, false);
            } else {
                turn = (turn + 1) % 4;
                turnStart(turn, false);
            }
        }

        function aiPlayTurn() { 
            if(gameState==="GAME_OVER" || gameState==="MENU" || players[turn].hand.length===0) return; 
            let idx = Math.floor(Math.random() * players[turn].hand.length);
            playCard(turn, idx); 
        }

        function checkCanChi(hand, card) { 
            if(globalBuffs.noChiPengTurns > 0 || !CARD_DB[card] || CARD_DB[card].isWildcard) return false; 
            let rels = CARD_DB[card].relations || []; 
            for(let r of rels) if(hand.includes(r)) return true; 
            return false; 
        }

        function checkCanPeng(hand, card) { 
            if(globalBuffs.noChiPengTurns > 0 || !CARD_DB[card] || CARD_DB[card].isWildcard) return false; 
            let cardFactions = CARD_DB[card].factions || [];
            for (let faction of cardFactions) {
                if (faction === "小丑二人组" || !FACTION_INFO[faction]) continue; 
                let needed = FACTION_INFO[faction].req - 1; 
                let count = 0;
                for (let h of hand) {
                    let hFactions = CARD_DB[h].factions || [];
                    if (CARD_DB[h].isWildcard || hFactions.includes(faction)) count++;
                }
                if (count >= needed) return true;
            }
            return false; 
        }

        function onCardClick(p, idx) {
            logTrace("ui", "onCardClick", { player: p, cardIndex: idx, card: players[p].hand[idx] });
            if(gameState === "NORMAL" && p === HUMAN_PLAYER && turn === HUMAN_PLAYER) {
                playCard(p, idx);
            } else if(gameState === "SELECTING_PENG" && p === HUMAN_PLAYER) {
                toggleCardSelectForPeng(idx);
            } else if(gameState === "AWAITING_RELATION_TARGET" && p === HUMAN_PLAYER) {
                handleRelationTargetSelect(idx);
            }
        }

        function playCard(p, idx) {
            let card = players[p].hand[idx];
            logTrace("action", "playCardInit", { player: p, card, idx });

            if(!isCurrentTurnExtra && card === "徐翱的针织帽" && players[p].hand.includes("徐翱")) {
                if(!isAI(p)) {
                    pendingHatPlay = { p, idx };
                    document.getElementById("hat-choice-modal").style.display = "flex";
                    return;
                } else {
                    let doCombo = Math.random() < 0.8;
                    executePlayCard(p, idx, doCombo);
                    return;
                }
            }

            executePlayCard(p, idx, false);
        }

        function confirmHatCombo(doCombo) {
            document.getElementById("hat-choice-modal").style.display = "none";
            if(!pendingHatPlay) return;
            let { p, idx } = pendingHatPlay;
            pendingHatPlay = null;
            logTrace("action", "confirmHatCombo", { player: p, doCombo });
            executePlayCard(p, idx, doCombo);
        }

        // 🌟 极速出牌核心：出牌当帧 0ms 响应入河
        function executePlayCard(p, idx, isHatCombo) {
            let card = players[p].hand.splice(idx, 1)[0];
            let revIdx = players[p].revealedCards.indexOf(card);
            if(revIdx !== -1) players[p].revealedCards.splice(revIdx, 1);

            playSound("play");

            // 物理守恒合体：将伴随打出的徐翱从手牌物理移除
            if(isHatCombo) {
                let xIdx = players[p].hand.indexOf("徐翱");
                if(xIdx !== -1) {
                    players[p].hand.splice(xIdx, 1);
                    let rxIdx = players[p].revealedCards.indexOf("徐翱");
                    if(rxIdx !== -1) players[p].revealedCards.splice(rxIdx, 1);
                    playSound("combo");
                    triggerFlash();
                    showSplash("🎩 合体出击！", "#9c27b0");
                    addBondLog(p, "onplay", "助眠陷阱", "与徐翱合体打出！", "吃碰该牌者将陷入一回合睡眠！");
                }
            }

            let wasUnskippable = unskippableNextCard || isCurrentTurnExtra;
            unskippableNextCard = false;

            pendingCardInfo = { 
                card: isHatCombo ? "徐翱" : card, 
                fromPlayer: p, 
                isUnskippable: wasUnskippable,
                isTrap: (!isCurrentTurnExtra && card === "范文豪"),
                isStop: (!isCurrentTurnExtra && card === "温秦富"),
                isHook: (!isCurrentTurnExtra && card === "唐洋"),
                isHatCombo: isHatCombo
            };

            logTrace("action", "cardPlayed", { player: p, pendingCardInfo, isCurrentTurnExtra });

            // 当帧同步更新玩家自身的手牌视图
            updateUI();

            if(isCurrentTurnExtra) {
                showFloatingText(p, "🚫 追加回合：技能失效", "#ff5252");
                addBondLog(p, "system", "技能失效", `打出【${card}】`, "追加回合内出牌一切效果失效！");
                afterCardPlayResolved(p, wasUnskippable);
                return;
            }

            triggerOnPlay(p, card, () => {
                afterCardPlayResolved(p, wasUnskippable);
            });
        }

        function afterCardPlayResolved(p, wasUnskippable) {
            if(checkWin(p)) return;

            if(buffs[p].extraPlay > 0) {
                buffs[p].extraPlay--;
                discardToRiver(p, pendingCardInfo.card, pendingCardInfo.isUnskippable, pendingCardInfo.isHatCombo);
                resetPendingCardInfo();
                updateUI();
                if(players[p].hand.length > 0) {
                    setUIState("NORMAL", `玩家 ${p} 连击出牌中！`);
                    if(isAI(p)) setTimeout(aiPlayTurn, 500);
                } else {
                    advanceTurn();
                }
                return;
            }

            let nextPlayer = (p + 1) % 4;
            let cChi = (!wasUnskippable) && checkCanChi(players[nextPlayer].hand, pendingCardInfo.card);
            let cPeng = (!wasUnskippable) && checkCanPeng(players[nextPlayer].hand, pendingCardInfo.card);

            logTrace("rule", "checkNextPlayerChiPeng", { targetPlayer: nextPlayer, canChi: cChi, canPeng: cPeng, wasUnskippable });

            if(cChi || cPeng) {
                if(nextPlayer === HUMAN_PLAYER) {
                    gameState = "WAITING_FOR_ACTION";
                    currentCanChi = cChi;
                    currentCanPeng = cPeng;
                    setUIState("WAITING_FOR_ACTION", `上家 (玩家 ${p}) 打出了【${pendingCardInfo.card}】${pendingCardInfo.isHatCombo?'(合体)':''}，请选择行动：`);
                    updateUI();
                } else {
                    handleSingleAIResponse(nextPlayer, cChi, cPeng);
                }
            } else {
                discardToRiver(p, pendingCardInfo.card, pendingCardInfo.isUnskippable, pendingCardInfo.isHatCombo);
                resetPendingCardInfo();
                advanceTurn();
            }
        }

        function resetPendingCardInfo() {
            pendingCardInfo = { card: null, fromPlayer: -1, isUnskippable: false, isTrap: false, isStop: false, isHook: false, isHatCombo: false };
        }

        function triggerOnPlay(p, card, callback) {
            logTrace("onplay", `Triggering on-play for ${card} by P${p}`, {});
            if(card === "刘鸿铭") {
                playSound("susu"); showSplash("侍奉之心！", "#ffd700");
                addBondLog(p, "onplay", "侍奉之心", "全员摸牌", "各抽一张牌，并顺时针开启全员追加回合！");
                for(let i=0; i<4; i++) if(deck.length > 0) players[i].hand.push(deck.pop());
                extraTurnQueue = [(p+1)%4, (p+2)%4, (p+3)%4, p];
                returnTurnAfterExtra = (p+1)%4;
                updateUI(); callback();
            } else if(card === "周晓培") {
                playSound("lol"); showSplash("圣诞天使！", "#ffd700");
                addBondLog(p, "onplay", "圣诞天使", "时光馈赠", "顺时针开启全员追加回合！");
                extraTurnQueue = [(p+1)%4, (p+2)%4, (p+3)%4, p];
                returnTurnAfterExtra = (p+1)%4;
                updateUI(); callback();
            } else if(card === "王歆昊") {
                // 物理守恒：严格从弃牌堆移除，绝不凭空克隆
                playSound("timi"); showSplash("圣诞礼物！", "#ffd700");
                addBondLog(p, "onplay", "圣诞礼物", "回捞弃牌", "所有人从弃牌堆随机打捞一张卡！");
                for(let i=0; i<4; i++) {
                    let candRivers = [];
                    for(let k=0; k<4; k++) {
                        if(players[k].discards.length > 0) candRivers.push(k);
                    }
                    if(candRivers.length > 0) {
                        let fromR = candRivers[Math.floor(Math.random() * candRivers.length)];
                        let rIndex = Math.floor(Math.random() * players[fromR].discards.length);
                        let picked = players[fromR].discards.splice(rIndex, 1)[0];
                        let rDom = document.getElementById(`river-${fromR}`);
                        if(rDom && rDom.children.length > rIndex) {
                            rDom.removeChild(rDom.children[rIndex]);
                        }
                        players[i].hand.push(picked);
                        showFloatingText(i, `+1 捞到【${picked}】`, "#4caf50");
                    }
                }
                updateUI(); callback();
            } else if(card === "界刘嘉祺") {
                if(isAI(p)) {
                    let t = (p+1)%4;
                    executeRevealOpponentCards(t);
                    callback();
                } else {
                    promptSelectPlayer(p, "哑婆婆：选择你想直接明牌展示两张手牌的对手", (t) => {
                        executeRevealOpponentCards(t);
                        callback();
                    });
                }
            } else if(card === "界曾灏铭") {
                playSound("jail");
                if(isAI(p)) {
                    let t = (p+1)%4;
                    buffs[p].skipTurnCount += 1;
                    applyNegativeEffect(t, "铁窗泪", () => { buffs[t].skipTurnCount += 1; });
                    addBondLog(p, "onplay", "铁窗泪", "双方画地为牢", `玩家 ${p} 与 玩家 ${t} 均停顿一回合！`);
                    callback();
                } else {
                    promptSelectPlayer(p, "铁窗泪：选择要陪你一起坐牢的玩家", (t) => {
                        buffs[p].skipTurnCount += 1;
                        applyNegativeEffect(t, "铁窗泪", () => { buffs[t].skipTurnCount += 1; });
                        addBondLog(p, "onplay", "铁窗泪", "双方画地为牢", `玩家 ${p} 与 玩家 ${t} 均停顿一回合！`);

        function executeRevealOpponentCards(t) {
            let hiddenCards = players[t].hand.filter(c => !players[t].revealedCards.includes(c));
            if(hiddenCards.length === 0) hiddenCards = players[t].hand.slice();
            hiddenCards.sort(() => Math.random() - 0.5);
            let toReveal = hiddenCards.slice(0, 2);
            toReveal.forEach(c => {
                if(!players[t].revealedCards.includes(c)) players[t].revealedCards.push(c);
            });
            showFloatingText(t, `👁️ 2张手牌被明牌!`, "#00e5ff");
            addBondLog(turn, "onplay", "哑婆婆", `透视明牌`, `直接令玩家 ${t} 的手牌【${toReveal.join('、')}】明牌化显示！`);

        function promptSelectPlayer(sourceP, tip, callback) {
            logTrace("ui", "promptSelectPlayerModal", { sourceP, tip });
            let modal = document.getElementById("target-select-modal");
            document.getElementById("target-modal-desc").innerText = tip;
            let wrap = document.getElementById("target-buttons-wrap");
            wrap.innerHTML = "";

            targetSelectionCallback = (chosenP) => {
                modal.style.display = "none";
                for(let i=0; i<4; i++) document.getElementById(`player-${i}`).classList.remove("targetable");
                targetSelectionCallback = null;
                logTrace("action", "targetChosen", { sourceP, targetPlayer: chosenP });
                callback(chosenP);
            };

            const P_NAMES = ["我 (下)", "对手 1 (左)", "对手 2 (上)", "对手 3 (右)"];
            for(let i=0; i<4; i++) {
                if(i !== sourceP) {
                    let btn = document.createElement("button");
                    btn.className = "target-pick-btn";
                    btn.innerText = `${P_NAMES[i]} (手牌: ${players[i].hand.length}张)`;
                    btn.onclick = () => targetSelectionCallback(i);

                    document.getElementById(`player-${i}`).classList.add("targetable");

            modal.style.display = "flex";

        function handleSingleAIResponse(aiPlayer, canChi, canPeng) {
            logTrace("ai", "handleSingleAIResponse", { aiPlayer, canChi, canPeng });
            let handled = false;
            if(canPeng && Math.random() < 0.6) {
                aiExecutePeng(aiPlayer);
                handled = true;
            } else if(canChi && Math.random() < 0.5) {
                aiExecuteChi(aiPlayer);
                handled = true;
            }
            if(!handled) {
                logTrace("ai", "AIPassed", { aiPlayer });
                discardToRiver(pendingCardInfo.fromPlayer, pendingCardInfo.card, pendingCardInfo.isUnskippable, pendingCardInfo.isHatCombo);
                resetPendingCardInfo();
                advanceTurn();
            }

        // 🌟 修复：AI 碰牌也严格执行“高阶阵营优先”
        function aiExecutePeng(p) {
            let card = pendingCardInfo.card;
            let factions = CARD_DB[card].factions || [];
            let validFactions = factions.filter(f => FACTION_INFO[f] && f !== "小丑二人组");
            // 降序排序，人数要求多的优先
            validFactions.sort((a,b) => FACTION_INFO[b].req - FACTION_INFO[a].req);

            for(let faction of validFactions) {
                let req = FACTION_INFO[faction].req - 1;
                let chosenHand = [];
                for(let h of players[p].hand) {
                    let hF = CARD_DB[h].factions || [];
                    if(CARD_DB[h].isWildcard || hF.includes(faction)) {
                        chosenHand.push(h);
                        if(chosenHand.length === req) break;
                    }
                }
                if(chosenHand.length === req) {
                    executePengAction(p, faction, chosenHand);
                    return;
                }
            }
        }

        function aiExecuteChi(p) {
            let card = pendingCardInfo.card;
            let rels = CARD_DB[card].relations || [];
            let targetCard = rels.find(r => players[p].hand.includes(r));
            if(!targetCard) return;
            executeChiAction(p, targetCard);
        }

        // 🌟 修复核心 Bug 1：按人数优先判定大阵营（例如 5 人梦之队优先于 3 人酥酥软软）
        function confirmPeng() {
            if(selectedCardsForPeng.length === 0) return;
            let handCards = selectedCardsForPeng.map(i => players[HUMAN_PLAYER].hand[i]);
            let targetCard = pendingCardInfo.card;
            let fCommon = null;
            let tFactions = (CARD_DB[targetCard].factions || []).filter(f => FACTION_INFO[f] && f !== "小丑二人组");
            
            // 🌟 核心排序：按阵营所需人数降序排列，确保满足人数最多的大阵营绝对优先判定！
            tFactions.sort((a, b) => FACTION_INFO[b].req - FACTION_INFO[a].req);

            let totalCardsCount = handCards.length + 1; // 选中的手牌 + 弃牌本身

            for(let f of tFactions) {
                let req = FACTION_INFO[f].req;
                // 只有当放入的牌数恰好等于或满足阵营人数时才进入校验
                if(totalCardsCount >= req) {
                    let ok = true;
                    for(let hc of handCards) {
                        let hF = CARD_DB[hc].factions || [];
                        if(!CARD_DB[hc].isWildcard && !hF.includes(f)) { 
                            ok = false; break; 
                        }
                    }
                    if(ok) {
                        fCommon = f; 
                        break; // 命中最高要求的大阵营，完美退出
                    }
                }
            }

            logTrace("action", "confirmPengAttempt", { fCommon, handCards, totalCardsCount });

            if(fCommon) {
                // 如果玩家多选了牌，只取出对应人数所需的牌，多余的不扣
                let needCount = FACTION_INFO[fCommon].req - 1;
                selectedCardsForPeng.sort((a,b)=>b-a);
                let chosen = [];
                for(let i=0; i<needCount; i++) {
                    let idx = selectedCardsForPeng[i];
                    chosen.push(players[HUMAN_PLAYER].hand.splice(idx, 1)[0]);
                }
                selectedCardsForPeng = [];
                executePengAction(HUMAN_PLAYER, fCommon, chosen);
            } else {
                showFloatingText(HUMAN_PLAYER, "阵营牌数不足或不符", "#f44336");
            }
        }

        function btnPass() {
            logTrace("ui", "btnPassClicked", { currentState: gameState });
            if(gameState === "SELECTING_PENG" || gameState === "AWAITING_RELATION_TARGET") {
                selectedCardsForPeng = [];

                setUIState("WAITING_FOR_ACTION", `上家 (玩家 ${pendingCardInfo.fromPlayer}) 打出了【${pendingCardInfo.card}】，请选择行动：`);

        function resolvePass() {
            logTrace("action", "resolvePass (Human passed)", {});
            selectedCardsForPeng = [];
            discardToRiver(pendingCardInfo.fromPlayer, pendingCardInfo.card, pendingCardInfo.isUnskippable, pendingCardInfo.isHatCombo);

        function checkClownInterruption(actorP, targetCard, onPassAction) {
            let clownees = [];
            for(let i=0; i<4; i++) {
                if(i === actorP) continue;
                let h = players[i].hand;
                let hasCombo1 = h.includes("曾灏铭") && h.includes("刘嘉祺");
                let hasCombo2 = h.includes("徐翱") && h.includes("安以文");
                if(hasCombo1 || hasCombo2) {
                    clownees.push({ p: i, combo: hasCombo1 ? ["曾灏铭", "刘嘉祺"] : ["徐翱", "安以文"] });
                }
            }

            if(clownees.length > 0) {
                let humanClown = clownees.find(c => c.p === HUMAN_PLAYER);
                if(humanClown) {
                    interruptState = { clownP: HUMAN_PLAYER, actorP, combo: humanClown.combo, resumeFn: onPassAction };
                    gameState = "INTERRUPTING";
                    setUIState("INTERRUPTING", `玩家 ${actorP} 正在吃牌！你持有【小丑二人组】，是否截断施法？`);
                    updateUI();
                    return;
                } else {
                    let ai = clownees[0];
                    if(Math.random() < 0.6) {
                        executeClownIntercept(ai.p, actorP, ai.combo);
                        return;
                    }
                }
            }

            onPassAction();
        }

        function confirmInterrupt() {
            if(!interruptState) return;
            let { clownP, actorP, combo } = interruptState;
            interruptState = null;
            logTrace("action", "confirmInterrupt", { clownP, actorP, combo });
            executeClownIntercept(clownP, actorP, combo);
        }

        function passInterrupt() {
            if(!interruptState) return;
            let resume = interruptState.resumeFn;
            interruptState = null;
            logTrace("action", "passInterrupt", {});
            resume();
        }

        function executeClownIntercept(clownP, victimP, comboCards) {
            logTrace("bond", "executeClownIntercept", { clownP, victimP, comboCards });
            playSound("clown");
            triggerScreenShake();
            showSplash("🤡 截断施法！", "#9c27b0");

            for(let c of comboCards) {
                let idx = players[clownP].hand.indexOf(c);
                if(idx !== -1) players[clownP].hand.splice(idx, 1);
                let rIdx = players[clownP].revealedCards.indexOf(c);
                if(rIdx !== -1) players[clownP].revealedCards.splice(rIdx, 1);
            }
            players[clownP].bonds.push({ type: "faction", name: "小丑二人组", desc: "截断吃牌并强塞一张手牌！", cards: comboCards });

            checkAndBreakLoveLetterOnBond(clownP);
            checkAndBreakLoveLetterOnBond(victimP);

            if(players[clownP].hand.length > 0) {
                let gift = players[clownP].hand.splice(0, 1)[0];
                let rIdx = players[clownP].revealedCards.indexOf(gift);
                if(rIdx !== -1) players[clownP].revealedCards.splice(rIdx, 1);
                players[victimP].hand.push(gift);
                showFloatingText(victimP, `被迫收下【${gift}】`, "#f44336");
            }

            addBondLog(clownP, "faction", "小丑二人组", "强行截断！", `拦截了玩家 ${victimP} 的吃牌，并强塞一张手牌！`);
            
            // 被拦截的弃牌正常落入河道
            discardToRiver(pendingCardInfo.fromPlayer, pendingCardInfo.card, pendingCardInfo.isUnskippable, pendingCardInfo.isHatCombo);
            resetPendingCardInfo();
            startPlayTurnAfterAction(clownP);
        }

        // 🌟 修复核心 Bug 2：被吃/碰走的卡牌，绝不放入弃牌河，确保物理唯一守恒
        function executeChiAction(p, cardInHand) {
            let discardedCard = pendingCardInfo.card;
            logTrace("action", "executeChiAction", { player: p, cardInHand, discardedCard });

            checkClownInterruption(p, discardedCard, () => {
                playSound("chi");
                let idx = players[p].hand.indexOf(cardInHand);
                if(idx !== -1) players[p].hand.splice(idx, 1);
                let rIdx = players[p].revealedCards.indexOf(cardInHand);
                if(rIdx !== -1) players[p].revealedCards.splice(rIdx, 1);

                // 被吃走的牌直接移入副露区，不留存河道
                players[p].bonds.push({
                    type: "relation",
                    name: `${cardInHand}-${discardedCard}`,
                    desc: getRelationDesc(cardInHand, discardedCard),
                    cards: [discardedCard, cardInHand]
                });

                checkAndBreakLoveLetterOnBond(p);
                handleEatenCardTraps(p);
                triggerRelationEffect(p, cardInHand, discardedCard);

                resetPendingCardInfo();

                if(!checkWin(p)) {
                    startPlayTurnAfterAction(p);
                }
            });
        }

        function executePengAction(p, faction, handCards) {
            let discardedCard = pendingCardInfo.card;
            logTrace("action", "executePengAction", { player: p, faction, handCards, discardedCard });
            playSound("peng");

            // 被碰走的牌直接移入副露区，绝不在河道重复计票
            let allCards = [discardedCard, ...handCards];
            players[p].bonds.push({
                type: "faction",
                name: faction,
                desc: FACTION_INFO[faction] ? FACTION_INFO[faction].desc : "发动阵营效果",
                cards: allCards
            });

            handCards.forEach(c => {
                let rIdx = players[p].revealedCards.indexOf(c);
                if(rIdx !== -1) players[p].revealedCards.splice(rIdx, 1);
            });

            checkAndBreakLoveLetterOnBond(p);
            handleEatenCardTraps(p);
            triggerFactionEffect(p, faction);

            resetPendingCardInfo();

            if(!checkWin(p)) {
                startPlayTurnAfterAction(p);
            }
        }

        function startPlayTurnAfterAction(p) {
            turn = p;
            gameState = "NORMAL";
            selectedCardsForPeng = [];
            setUIState("NORMAL", `玩家 ${p} 吃/碰成功，请打出一张手牌：`);
            updateUI();
            if(isAI(p)) {
                setTimeout(aiPlayTurn, 650);
            }

        function handleEatenCardTraps(eaterP) {
            logTrace("trap", "handleEatenCardTraps", { eaterP, pendingCardInfo });
            if(pendingCardInfo.isTrap) {
                applyNegativeEffect(eaterP, "骗人题反制", () => {

                });

        function triggerRelationEffect(p, c1, c2) {
            let key1 = `${c1}-${c2}`; let key2 = `${c2}-${c1}`;
            let match = (k) => (key1 === k || key2 === k);
            logTrace("relation", "triggerRelationEffect", { player: p, c1, c2 });

            if(match("曾灏铭-刘嘉祺") || match("曾灏铭-曾灏铭") || match("界曾灏铭-界曾灏铭")) {
                if(lastActivatedBond) {
                    addBondLog(p, "relation", "复刻", "最熟悉的陌生人", `发动了上一个羁绊：${lastActivatedBond}`);
                    if(FACTION_INFO[lastActivatedBond]) triggerFactionEffect(p, lastActivatedBond);
                } else {
                    addBondLog(p, "relation", "无羁绊复刻", "最熟悉的陌生人", "场上此前未发动过任何羁绊。");
                }
            } else if(match("徐翱-安以文")) {
                if(players[p].hand.length >= 5) {
                    buffs[p].extraPlay += 1;
                    addBondLog(p, "relation", "半段", "牌力充盈", "额外获得一次连打机会！");
                }
            } else if(match("徐翱-李奕潼")) {
                let mePrime = isPrime(players[p].hand.length);
                let opPrime = isPrime(players[pendingCardInfo.fromPlayer >= 0 ? pendingCardInfo.fromPlayer : 0].hand.length);
                if(mePrime && opPrime) {
                    buffs[p].extraPlay += 1;
                    if(pendingCardInfo.fromPlayer >= 0) buffs[pendingCardInfo.fromPlayer].extraPlay += 1;
                    addBondLog(p, "relation", "数学王者", "质数共振", "双方均获得一次额外连打机会！");
                }
            } else if(match("朱喆宇-孙佳煜")) {
                let nextP = (p+1)%4;
                applyNegativeEffect(nextP, "完美镜头", () => {
                    buffs[nextP].skipTurnCount += 1;
                    addBondLog(p, "relation", "完美镜头", "特写暂停", `令下家 玩家 ${nextP} 暂停一回合行动！`);
                });
            } else if(match("刘子豪-安以文")) {
                playSound("mama");
                addBondLog(p, "relation", "妈妈", "全场高呼妈妈", "全员各抽一张牌！");
                for(let i=0; i<4; i++) if(deck.length > 0) players[i].hand.push(deck.pop());
            } else if(match("顾嘉誉-郑昕玮") || match("杨嘉毅-郑昕玮")) {
                buffs[p].cannotDraw = true;
                addBondLog(p, "relation", "坐骑形态", "无法自拔", "自身下回合无法摸牌！");
            } else if(match("单冯烨-刘嘉祺")) {
                let target = pendingCardInfo.fromPlayer >= 0 ? pendingCardInfo.fromPlayer : (p+1)%4;
                if(players[target].hand.length > 0 && players[p].hand.length > 0) {
                    let cardT = players[target].hand.splice(Math.floor(Math.random()*players[target].hand.length), 1)[0];
                    let cardMe = players[p].hand.splice(Math.floor(Math.random()*players[p].hand.length), 1)[0];
                    players[p].hand.push(cardT);
                    players[target].hand.push(cardMe);
                    addBondLog(p, "relation", "姐姐", "换牌魔术", `与 玩家 ${target} 随机交换了一张手牌！`);
                }
            } else if(match("张浩泉-张浩泉")) {
                playSound("ora");
                for(let i=0; i<3; i++) if(deck.length > 0) players[p].hand.push(deck.pop());
                buffs[p].extraPlay += 3;
                buffs[p].skipTurnCount += 2;
                addBondLog(p, "relation", "超导战士", "超频过载", "疯狂抽打3次，但下两回合无法行动！");
            }
        }

        function triggerFactionEffect(p, faction) {
            lastActivatedBond = faction;
            logTrace("faction", "triggerFactionEffect", { player: p, faction });
            if(faction === "强盛集团") {
                if(deck.length > 0) players[p].hand.push(deck.pop());
                unskippableNextCard = true;
                buffs[p].extraPlay += 1;
                addBondLog(p, "faction", "强盛集团", "狂飙突进", "抽一张牌，并额外打出一张不可吃碰的牌！");
            } else if(faction === "三小只") {
                let passed = [];
                for(let i=0; i<4; i++) {
                    if(players[i].hand.length > 0) {
                        passed[i] = players[i].hand.splice(Math.floor(Math.random()*players[i].hand.length), 1)[0];
                        let rIdx = players[i].revealedCards.indexOf(passed[i]);
                        if(rIdx !== -1) players[i].revealedCards.splice(rIdx, 1);
                    } else { passed[i] = null; }
                }
                for(let i=0; i<4; i++) {
                    let next = (i+1)%4;
                    if(passed[i]) players[next].hand.push(passed[i]);
                }
                addBondLog(p, "faction", "三小只", "快乐传真", "全场随机一张手牌顺时针传递给下家！");
            } else if(faction === "酥酥软软") {
                playSound("susu");
                addBondLog(p, "faction", "酥酥软软", "声入人心", "“再加上你那酥酥软软的声音...”");
            } else if(faction === "增重计划") {
                let t = (p+1)%4;
                buffs[t].extraDraw += 1;
                addBondLog(p, "faction", "增重计划", "加量不加价", `指定 玩家 ${t} 下回合额外抽一张牌！`);
            } else if(faction === "启动·英雄联盟") {
                playSound("lol");
                let keys = ["强盛集团", "酥酥软软", "卷王二人组", "增重计划"];
                let chosen = keys[Math.floor(Math.random()*keys.length)];
                addBondLog(p, "faction", "英雄联盟", "随机启动", `白嫖发动基础阵营：【${chosen}】`);
                triggerFactionEffect(p, chosen);
            } else if(faction === "启动·王者荣耀") {
                playSound("timi");
                if(lastActivatedBond && lastActivatedBond !== "启动·王者荣耀") {
                    addBondLog(p, "faction", "王者荣耀", "历史重现", `复刻发动上一个羁绊：【${lastActivatedBond}】`);
                    triggerFactionEffect(p, lastActivatedBond);
                } else {
                    addBondLog(p, "faction", "王者荣耀", "孤立无援", "此前没有发动过有效羁绊。");
                }
            } else if(faction === "梦之队·一队") {
                playSound("duel");
                let target = (p+1)%4;
                if(players[target].hand.length < players[p].hand.length && players[p].hand.length > 0) {
                    let gift = players[p].hand.splice(0, 1)[0];
                    let rIdx = players[p].revealedCards.indexOf(gift);
                    if(rIdx !== -1) players[p].revealedCards.splice(rIdx, 1);
                    players[target].hand.push(gift);
                    addBondLog(p, "faction", "梦之队·一队", "胜利制裁", `手牌多于对手，送出了一张【${gift}】！`);
                }
            } else if(faction === "梦之队·二队") {
                playSound("duel");
                let target = (p+1)%4;
                if(players[target].hand.length > players[p].hand.length && players[p].hand.length > 0) {
                    let gift = players[p].hand.splice(0, 1)[0];
                    let rIdx = players[p].revealedCards.indexOf(gift);
                    if(rIdx !== -1) players[p].revealedCards.splice(rIdx, 1);
                    players[target].hand.push(gift);
                    addBondLog(p, "faction", "梦之队·二队", "以弱胜强", `手牌少于对手，送出了一张【${gift}】！`);
                }
            } else if(faction === "卷王二人组") {
                if(deck.length > 0) {
                    players[p].hand.push(deck.pop());
                    addBondLog(p, "faction", "卷王二人组", "偷偷努力", "额外摸一张牌并不打出！");
                }
            } else if(faction === "南模天团") {
                globalBuffs.noChiPengTurns = 4;
                showSplash("南模封锁！", "#673ab7");
                addBondLog(p, "faction", "南模天团", "全场禁魔", "未来一圈内禁止所有人吃碰！");
            }
        }

        function discardToRiver(p, card, unskippable, isHat) {
            if(!card) return;
            logTrace("river", "discardToRiver", { player: p, card, unskippable, isHat });
            let r = document.getElementById(`river-${p}`);
            let div = document.createElement("div");
            div.className = "card mini-card" + (unskippable ? " unskippable" : "");
            if(isHat) div.style.border = "2px solid #9c27b0";
            div.style.backgroundImage = `url('${CARD_DB[card].img}')`;
            div.innerText = isHat ? "徐翱(帽)" : card;
            r.appendChild(div);
            players[p].discards.push(card);
        }

        function setUIState(st, text) {
            logTrace("ui", "setUIState", { targetState: st, textPrompt: text });
            let pnl = document.getElementById("action-panel");
            let t = document.getElementById("action-text");
            let bChi = document.getElementById("btn-chi");
            let bPeng = document.getElementById("btn-peng");
            let bConf = document.getElementById("btn-confirm");
            let bPass = document.getElementById("btn-pass");
            let bInt = document.getElementById("btn-interrupt");
            let bPassInt = document.getElementById("btn-pass-interrupt");
            let bRest = document.getElementById("btn-restart");
            let bMenu = document.getElementById("btn-menu");
            let disp = document.getElementById("pending-card-display");
            let hintEl = document.getElementById("pending-card-hint");

            pnl.style.display = "block";
            t.innerHTML = text;
            bChi.style.display = "none";
            bPeng.style.display = "none";
            bConf.style.display = "none";
            bPass.style.display = "none";
            bInt.style.display = "none";
            bPassInt.style.display = "none";
            bRest.style.display = "none";
            bMenu.style.display = "none";
            disp.innerHTML = "";
            hintEl.style.display = "none";
            hintEl.innerHTML = "";

            if(st === "WAITING_FOR_ACTION") {
                if(currentCanChi) bChi.style.display = "inline-block";
                if(currentCanPeng) bPeng.style.display = "inline-block";
                bPass.style.display = "inline-block";
                bPass.innerText = "过";
                renderPendingCard(disp);
                renderCardBondsHint(hintEl, pendingCardInfo.card);
            } else if(st === "SELECTING_PENG") {
                bConf.style.display = "inline-block";
                bPass.style.display = "inline-block";
                bPass.innerText = "取消";
                renderPendingCard(disp);
                renderCardBondsHint(hintEl, pendingCardInfo.card);
            } else if(st === "AWAITING_RELATION_TARGET") {
                bPass.style.display = "inline-block";
                bPass.innerText = "取消";
                renderPendingCard(disp);
                renderCardBondsHint(hintEl, pendingCardInfo.card);
            } else if(st === "INTERRUPTING") {
                bInt.style.display = "inline-block";
                bPassInt.style.display = "inline-block";
            } else if(st === "GAME_OVER") {
                bRest.style.display = "block";
                bMenu.style.display = "block";
            }
        }

        function renderCardBondsHint(hintEl, cardName) {
            if(!cardName || !CARD_DB[cardName]) return;
            let cData = CARD_DB[cardName];
            let rels = cData.relations || [];
            let facs = cData.factions || [];
            
            let html = "";
            if(rels.length > 0) {
                html += `<div><span class="hint-badge-relation">🔗 关系牌：</span>${rels.join("、")}</div>`;
            }
            if(facs.length > 0) {
                let fStrs = facs.map(f => {
                    let req = FACTION_INFO[f] ? FACTION_INFO[f].req : 0;
                    return req > 0 ? `${f}(${req}人)` : f;
                });
                html += `<div><span class="hint-badge-faction">🛡️ 所属阵营：</span>${fStrs.join("、")}</div>`;
            }
            if(html !== "") {
                hintEl.innerHTML = html;
                hintEl.style.display = "block";
            }
        }

        function renderPendingCard(container) {
            if(!pendingCardInfo.card) return;
            let c = document.createElement("div");
            c.className = "card" + (pendingCardInfo.isUnskippable ? " unskippable" : "");
            if(pendingCardInfo.isHatCombo) c.style.border = "3px solid #9c27b0";
            c.style.backgroundImage = `url('${CARD_DB[pendingCardInfo.card].img}')`;
            c.innerText = pendingCardInfo.isHatCombo ? "徐翱(合体)" : pendingCardInfo.card;
            container.appendChild(c);
        }

        function updateUI() {
            document.getElementById("deckCount").innerText = `牌库: ${deck.length}`;

            for(let i=0; i<4; i++) {
                let pEl = document.getElementById(`player-${i}`);
                if(i === turn && gameState !== "GAME_OVER") pEl.classList.add("active-player");
                else pEl.classList.remove("active-player");

                let sp = document.getElementById(`status-${i}`);
                sp.innerHTML = "";
                if(buffs[i].immune) sp.innerHTML += `<div class="status-tag positive">🛡️ 护盾</div>`;
                if(buffs[i].skipTurnCount > 0) sp.innerHTML += `<div class="status-tag negative">🚫 罚坐x${buffs[i].skipTurnCount}</div>`;
                if(buffs[i].cannotDraw) sp.innerHTML += `<div class="status-tag negative">🈲 禁摸牌</div>`;
                if(buffs[i].onlyChiPengTurns > 0) sp.innerHTML += `<div class="status-tag negative">🤐 嘲讽</div>`;
                if(buffs[i].fishHookTurns > 0) sp.innerHTML += `<div class="status-tag positive">🎣 钓鱼中</div>`;
                if(extraTurnQueue.includes(i)) sp.innerHTML += `<div class="status-tag extra">⏰ 候补追加</div>`;
                if(buffs[i].loveLetter) sp.innerHTML += `<div class="status-tag love">💌 情书攻势(剩${buffs[i].loveLetter.remainingTurns})</div>`;

                let hEl = document.getElementById(`hand-${i}`);
                hEl.innerHTML = "";
                players[i].hand.forEach((card, idx) => {
                    let cDiv = document.createElement("div");
                    cDiv.className = "card";
                    if(CARD_DB[card].isWildcard) cDiv.classList.add("card-gold");
                    if(unskippableNextCard && i === turn) cDiv.classList.add("unskippable");

                    if(i === HUMAN_PLAYER) {
                        cDiv.style.backgroundImage = `url('${CARD_DB[card].img}')`;
                        cDiv.innerText = card;
                        if(selectedCardsForPeng.includes(idx)) cDiv.classList.add("card-selected");

                        let tc = document.createElement("div");
                        tc.className = "tag-container";
                        let factions = CARD_DB[card].factions || [];
                        for(let f of factions) {
                            let fi = FACTION_INFO[f];
                            if(fi) {
                                let tag = document.createElement("div");
                                tag.className = "f-tag";
                                tag.style.backgroundColor = fi.color;
                                tag.style.clipPath = fi.shape;
                                tag.innerText = fi.text;
                                tc.appendChild(tag);
                            }
                        }
                        cDiv.appendChild(tc);

                        let tt = document.createElement("div");
                        tt.className = "card-tooltip";
                        tt.innerHTML = `<div class="tooltip-title">${card}</div>`;
                        if(CARD_DB[card].onPlayDesc) tt.innerHTML += `<div class="tooltip-item" style="color:#00e676;">${CARD_DB[card].onPlayDesc}</div>`;
                        if(factions.length > 0) tt.innerHTML += `<div class="tooltip-item"><b>阵营：</b>${factions.join("、")}</div>`;
                        let rels = CARD_DB[card].relations || [];
                        if(rels.length > 0) tt.innerHTML += `<div class="tooltip-item"><b>关系羁绊：</b>${rels.join("、")}</div>`;
                        cDiv.appendChild(tt);
                    } else {
                        if(players[i].revealedCards.includes(card)) {
                            cDiv.classList.add("card-revealed");
                            cDiv.style.backgroundImage = `url('${CARD_DB[card].img}')`;
                            cDiv.innerText = card;
                            let rTag = document.createElement("div");
                            rTag.className = "card-revealed-tag";
                            rTag.innerText = "明牌";
                            cDiv.appendChild(rTag);
                        } else {
                            cDiv.classList.add("card-back");
                            cDiv.innerText = "";
                        }
                    }

                    cDiv.onclick = (e) => { e.stopPropagation(); onCardClick(i, idx); };
                    hEl.appendChild(cDiv);
                });

                let bEl = document.getElementById(`bond-${i}`);
                bEl.innerHTML = players[i].bonds.length === 0 ? "副露区" : "";
                players[i].bonds.forEach((b) => {
                    let bg = document.createElement("div");
                    bg.className = `bond-group`;

                    let bt = document.createElement("div");
                    bt.className = "bond-title";
                    bt.style.backgroundColor = (b.type === "relation") ? "#e91e63" : "#ff9800";
                    bt.innerText = b.name;
                    bg.appendChild(bt);

                    let bcc = document.createElement("div");
                    bcc.className = "bond-cards-container";
                    b.cards.forEach(bc => {
                        let c = document.createElement("div");
                        c.className = "card bond-card";
                        c.style.backgroundImage = `url('${CARD_DB[bc].img}')`;
                        c.innerText = bc;
                        bcc.appendChild(c);
                    });
                    bg.appendChild(bcc);
                    bEl.appendChild(bg);
                });
            }
        }
    </script>
</body>
</html>
